# ============================================================
# TradeOS — Docker Compose
# Full stack: API + DB + Redis + Kafka + Temporal + PaddleOCR
# ============================================================

services:

  # ── FastAPI Backend ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - tradeos

  # ── PostgreSQL + pgvector ─────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeos}
      POSTGRES_DB: ${POSTGRES_DB:-tradeos}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./001_core_schema.sql:/docker-entrypoint-initdb.d/001_core_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tradeos" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradeos

  # ── Redis (hot cache + rate limiting) ────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tradeos

  # ── Kafka (event bus) ─────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - tradeos

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - tradeos

  # ── Kafka UI (visualize messages in browser) ──────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tradeos-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - tradeos

  # ── Temporal (durable workflow execution) ─────────────────
  temporal:
    image: temporalio/auto-setup:1.22
    container_name: temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-tradeos}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-tradeos}
      - POSTGRES_SEEDS=${POSTGRES_SEEDS:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradeos

  temporal-ui:
    image: temporalio/ui:2.21
    container_name: temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - tradeos

  # ── PaddleOCR Service ─────────────────────────────────────
  ocr:
    image: paddlepaddle/paddle:2.6.0
    container_name: ocr
    command: >
      python -m uvicorn ocr_service:app --host 0.0.0.0 --port 8100
    ports:
      - "8100:8100"
    volumes:
      - ./services/ocr:/app
    working_dir: /app
    networks:
      - tradeos

  # ── Local LLM — Primary Provider (Ollama + qwen2.5:3b) ──────
  ollama:
    image: ollama/ollama:0.3.12
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - tradeos

  # ── WhatsApp Webhook Proxy (ngrok in dev) ─────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http api:8000 --domain=${NGROK_DOMAIN}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - api
    profiles:
      - dev
    networks:
      - tradeos

volumes:
  pgdata:
  redisdata:
  ollamadata:

networks:
  tradeos:
    driver: bridge
