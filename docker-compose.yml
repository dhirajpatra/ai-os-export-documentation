# ============================================================
# TradeOS + OpenClaw — Complete Multi-Agent Stack
# Full stack: API + OpenClaw + DB + Redis + Temporal + Ollama + OCR
# ============================================================

services:

  # ── FastAPI Backend ───────────────────────────────────────
  api:
    build:
      context: ./tradeos
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - ./tradeos/.env
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tradeos}:${POSTGRES_PASSWORD:-tradeos}@postgres:5432/${POSTGRES_DB:-tradeos}
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://ocr:8100/extract}
    volumes:
      - ./tradeos:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tradeos

  # ── Frontend Web App ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"   # Nginx inside the container listens on 80
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - tradeos

  # ── PostgreSQL + pgvector ─────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeos}
      POSTGRES_DB: ${POSTGRES_DB:-tradeos}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tradeos/001_core_schema.sql:/docker-entrypoint-initdb.d/001_core_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeos}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradeos

  # ── Redis (hot cache + rate limiting + OpenClaw queue) ────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tradeos

  # ── PaddleOCR Service ─────────────────────────────────────
  ocr:
    build:
      context: ./services/ocr
      dockerfile: Dockerfile
    container_name: ocr
    ports:
      - "8100:8100"
    restart: unless-stopped
    networks:
      - tradeos

# ── Volumes ─────────────────────────────────────────────────
volumes:
  pgdata:
  redisdata:
  openclaw_workspace:
  openclaw_config:
  openclaw_logs:
  openclaw_memory:

# ── Networks ───────────────────────────────────────────────
networks:
  tradeos:
    driver: bridge
